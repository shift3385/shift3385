name: Profile metrics

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  light:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shift3385
          filename: profile-stats/metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          plugin_languages: "yes"
          plugin_languages_analysis_timeout: 15
          config_timezone: America/Havana
  dark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shift3385
          filename: profile-stats/metrics.dark.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          plugin_languages: "yes"
          plugin_languages_analysis_timeout: 15
         config_timezone: America/Havana
          config_theme: github-dark
